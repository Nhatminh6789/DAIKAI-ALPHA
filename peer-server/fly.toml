# Đổi "daikai-peer" thành tên app của bạn (phải là duy nhất trên Fly.io).
app = "daikai-peer"
primary_region = "sin"   # Singapore, gần Việt Nam nhất

[build]

[env]
  PORT = "9000"
  # Địa chỉ web game của bạn, nhiều địa chỉ thì ngăn cách bằng dấu phẩy
  ALLOWED_ORIGINS = "https://nhatminh6789.github.io"

[http_service]
  internal_port = 9000
  force_https = true
  # Phải luôn chạy: máy chủ ngủ thì người chơi không ghép trận được
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
