<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daikai · Test máy chủ</title>
<style>
body{font:15px/1.4 system-ui,sans-serif;margin:0;padding:14px;background:#f8f8f8;color:#111;max-width:640px;margin-inline:auto}
h1{font-size:18px;letter-spacing:.2em;font-weight:400;text-transform:uppercase}
.c{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;margin:10px 0}
.c h2{font-size:12px;letter-spacing:.15em;color:#888;font-weight:600;margin:0 0 8px;text-transform:uppercase}
button{font:inherit;padding:.5em 1em;border:1px solid #111;background:#111;color:#fff;border-radius:8px}
button.g{background:#fff;color:#111}
input{font:inherit;padding:.5em;border:1px solid #bbb;border-radius:8px;width:7em;text-transform:uppercase;letter-spacing:.2em}
.big{font:300 34px ui-monospace,monospace;letter-spacing:.2em}
.ok{color:#1a8f45;font-weight:600}.bad{color:#d33;font-weight:600}
pre{margin:0;white-space:pre-wrap;font:12px/1.4 ui-monospace,monospace;max-height:180px;overflow:auto}
td{padding:2px 10px 2px 0}
</style></head><body>
<h1>Daikai · Test máy chủ</h1>
<div class="c"><h2>1. Kết nối máy chủ</h2><div id="srv">Đang kết nối…</div></div>
<div class="c"><h2>2. Thử bắt cặp bằng mã phòng (dùng 2 máy)</h2>
<p>Máy A bấm <b>Tạo phòng</b>, máy B nhập mã rồi bấm <b>Vào phòng</b>.</p>
<button id="mk">Tạo phòng</button> <span class="big" id="code"></span><br><br>
<input id="inp" maxlength="5" placeholder="MÃ"> <button class="g" id="jn">Vào phòng</button>
<div id="rm" style="margin-top:10px"></div></div>
<div class="c"><h2>3. Máy chủ đang thấy</h2><div id="st">…</div></div>
<div class="c"><h2>Nhật ký</h2><pre id="lg"></pre></div>
<script src="/relay-client.js"></script>
<script>
const $=id=>document.getElementById(id),URL_WS=(location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws';
const lg=t=>{const e=$('lg');e.textContent=new Date().toLocaleTimeString()+'  '+t+'\n'+e.textContent};
const CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',gen=()=>Array.from({length:5},()=>CH[Math.floor(Math.random()*CH.length)]).join('');
let P=null,wsRtt=[],pr=[],conn=null,pingT=0;
function boot(){P=new RelayPeer(null,URL_WS);
 P.on('open',id=>{lg('Đã nối máy chủ, id '+id);$('srv').innerHTML='<span class="ok">Đã kết nối</span>'});
 P.on('error',e=>{lg('Lỗi: '+e.type);if(e.type==='network')$('srv').innerHTML='<span class="bad">Không nối được máy chủ</span>'});
 P.on('hb',r=>{wsRtt.push(r);if(wsRtt.length>10)wsRtt.shift();const a=wsRtt.reduce((x,y)=>x+y,0)/wsRtt.length;$('srv').innerHTML='<span class="ok">Đã kết nối</span> · ping tới máy chủ: <b>'+Math.round(r)+' ms</b> (TB '+Math.round(a)+' ms)'});
 setInterval(()=>P&&P.ping(),2000);
}
function link(c,who){conn=c;pr=[];
 c.on('open',()=>{lg('Đã nối với '+who);$('rm').innerHTML='<span class="ok">● Đã bắt cặp với '+who+'</span>';
  clearInterval(pingT);pingT=setInterval(()=>c.send({t:'p',ts:performance.now()}),1000)});
 c.on('data',m=>{if(m.t==='p')c.send({t:'q',ts:m.ts});else if(m.t==='q'){const r=performance.now()-m.ts;pr.push(r);if(pr.length>20)pr.shift();
  const a=pr.reduce((x,y)=>x+y,0)/pr.length;$('rm').innerHTML='<span class="ok">● Đã bắt cặp</span> · ping giữa 2 máy: <b>'+Math.round(r)+' ms</b> (TB '+Math.round(a)+', cao nhất '+Math.round(Math.max(...pr))+')'}});
 c.on('close',()=>{clearInterval(pingT);lg('Đối phương đã thoát');$('rm').innerHTML='<span class="bad">Mất kết nối</span>'})}
$('mk').onclick=()=>{if(P)P.destroy();const code=gen();P=new RelayPeer('test-'+code,URL_WS);
 P.on('open',()=>{$('code').textContent=code;$('rm').textContent='Đang chờ máy B…';lg('Tạo phòng '+code)});
 P.on('connection',c=>link(c,'máy B'));P.on('error',e=>lg('Lỗi: '+e.type));
 P.on('hb',r=>{wsRtt.push(r)});setInterval(()=>P&&P.ping(),2000)};
$('jn').onclick=()=>{const code=$('inp').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==5){$('rm').innerHTML='<span class="bad">Mã gồm 5 ký tự</span>';return}
 if(P)P.destroy();P=new RelayPeer(null,URL_WS);
 P.on('open',()=>{lg('Vào phòng '+code);link(P.connect('test-'+code),'máy A')});
 P.on('error',e=>{lg('Lỗi: '+e.type);$('rm').innerHTML='<span class="bad">'+(e.type==='peer-unavailable'?'Không tìm thấy phòng '+code:'Lỗi '+e.type)+'</span>'})};
async function stats(){try{const s=await (await fetch('/stats',{cache:'no-store'})).json();
 $('st').innerHTML='<table><tr><td>Vùng máy chủ</td><td><b>'+s.region+'</b></td></tr><tr><td>Đang online</td><td><b>'+s.online+'</b></td></tr><tr><td>Trận đang chạy</td><td><b>'+s.activeMatches+'</b></td></tr><tr><td>Phòng đang chờ</td><td><b>'+s.waitingRooms+'</b></td></tr><tr><td>Đang ghép rank</td><td><b>'+(s.rankSlots.length?s.rankSlots.map(x=>'hạng '+x.tier+' (ô '+x.slot+')').join(', '):'không ai')+'</b></td></tr><tr><td>Đã bắt cặp tổng</td><td><b>'+s.totals.pairs+'</b></td></tr></table>'}catch(e){$('st').textContent='Không đọc được /stats'}}
boot();stats();setInterval(stats,2000);
</script></body></html>
